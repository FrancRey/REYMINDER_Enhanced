{% extends "base.html" %}
{% block title %}Reset password · REYMINDER{% endblock %}
{% block body %}
<main class="auth-layout auth-layout-single">
  <section class="auth-panel">
    <button class="theme-toggle auth-theme" type="button" data-theme-toggle><span data-theme-icon>☾</span><span data-theme-label>Dark mode</span></button>
    <div class="auth-card">
      <a class="brand" href="{{ url_for('login') }}"><span class="brand-mark">R</span><span>REY<span class="brand-light">MINDER</span></span></a>
      <span class="eyebrow">NEW CREDENTIALS</span><h2>Set a new password</h2><p class="muted">Choose a password with at least 8 characters.</p>
      <form method="post" class="form-stack">
        <label for="password">New password</label><div class="password-wrap"><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><button type="button" class="eye-button" data-password-toggle="password" aria-label="Show password">◉</button></div>
        <label for="confirm_password">Confirm new password</label><div class="password-wrap"><input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required><button type="button" class="eye-button" data-password-toggle="confirm_password" aria-label="Show password">◉</button></div>
        <button class="button button-primary button-full" type="submit">Update password <span>→</span></button>
      </form>
    </div>
  </section>
</main>
{% endblock %}
